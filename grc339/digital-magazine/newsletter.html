<!doctype html>
<html lang="en">
   <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1" />
      <link rel="stylesheet" type="text/css" href="style.css">
      <link rel="stylesheet" href="https://use.typekit.net/tzs8akq.css">
      <link rel="stylesheet" href="https://use.typekit.net/tzs8akq.css">
      <link rel="stylesheet" href="https://use.typekit.net/tzs8akq.css">

      <title>The Analytic</title>
      <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
      <meta http-equiv="Pragma" content="no-cache" />
      <meta http-equiv="Expires" content="0" />
   </head>
   <body>
      <div class="container">
         <header>
            <h1><a href="index.html"> <img src="the-analytic.svg" alt="The Analytic"></a></h1>
            <nav>
               <ul>
                  <li><a href="#">Trends</a></li>
                  <li><a href="#">Celebrities</a></li>
                  <li><a href="#">Entertainment</a></li>
                  <li><a href="#">Media</a></li>
                  <li><a href="#">Newsletter</a></li>
               </ul>
            </nav>
         </header>
         <main>
            <div class="newsletter-container">
                
               <h2>Subscribe to Stay Up-to-Date!</h2>
               <form>
                   <section class="personal-info">
                       <h2>Personal Information</h2>
                       <ul>
                           <li><label for="name">Name:</label> <input type="text" name="name" id="name" placeholder="First and Last Name" /></li>
                           <li><label for="email">Email:</label> <input type="email" name="email" id="email" placeholder="Email Address" /></li>
                           <li><label for="email">Phone:</label> <input type="phone" name="phone" id="phone" placeholder="Phone Number" /></li>

                       </ul>
                   </section>

                   <section class="content">
                   <h2>Content Preference</h2>
                   <ul>
                       <li><input type="checkbox" id="trends" value="trends"/> <label for="trends">Trends</label></li>
                       <li><input type="checkbox" id="celebrities" value="celebrities" /> <label for="celebrities">Celebrities</label></li>
                       <li><input type="checkbox" id="entertainment" value="entertainment" /> <label for="entertainment">Entertainment</label></li>
                       <li><input type="checkbox" id="media" value="media" /> <label for="media">Media</label></li>

                   </ul>
                   </section>

                   <section class="suggestions">
                     <h2>Please let us know if you have any content suggestions!</h2>
                     <textarea id="suggestions" name="suggestions" placeholder="Share your ideas here..."></textarea>
                   </section>

                   <section>
                     <button type="submit">Confirm Choices</button>
                  </section>
               </form>
           </div>
         </main>
   
         <footer>
            <p>
               All rights reserved.
            </p>
         </footer>
      </div>
   </body>
</html>
